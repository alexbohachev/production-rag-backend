services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      API_KEYS: dev-key
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BACKEND: hash
    ports:
      - "8000:8000"
